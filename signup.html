<body class="auth-page" data-private-page>
<a class="skip-link" href="#main">본문으로 바로가기</a>
<div data-site-header></div>
<p class="container auth-global-message" data-auth-global-message role="alert" hidden></p>
<div data-site-drawer></div>
<main id="main" class="container auth-main" tabindex="-1">
  <section class="auth-card" aria-labelledby="auth-title">
    <p class="auth-eyebrow">AA안과</p><h1 id="auth-title">회원가입</h1>
    <p class="auth-description">이메일과 비밀번호로 계정을 만들어 주세요.</p>
    <form data-auth-form="signup" novalidate>
      <label for="auth-email">이메일</label><input id="auth-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="email@example.com" required maxlength="254" spellcheck="false" autocapitalize="none">
      <label for="auth-password">비밀번호</label><input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="6" required aria-describedby="auth-password-help">
      <p class="auth-field-help" id="auth-password-help">비밀번호는 6자 이상 입력해 주세요.</p>
      <p class="auth-message" data-auth-message role="status" aria-live="polite" hidden></p>
      <button class="auth-submit" type="submit" disabled>회원가입</button>
    </form>
    <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
    <p class="auth-emr-note">계정 가입만으로 EMR 환자 기록이 연결되지는 않습니다.</p>
  </section>
</main>
<div data-site-footer></div>
<aside class="quick-widget" data-quick-widget aria-label="상담 및 예약">
  <div class="quick-actions" id="quick-actions" data-quick-actions hidden>
    <a class="quick-action" data-kakao-link role="link" tabindex="0" aria-disabled="true" aria-describedby="kakao-status"><img src="assets/icons/kakao.svg" width="36" height="36" alt=""><span>카카오상담</span><span class="visually-hidden" id="kakao-status" data-kakao-status>연결 준비 중</span></a>
    <a class="quick-action" data-booking-link role="link" tabindex="0" aria-disabled="true" aria-describedby="booking-status"><img src="assets/icons/naver.svg" width="36" height="36" alt=""><span>네이버예약</span><span class="visually-hidden" id="booking-status" data-booking-status>연결 준비 중</span></a>
  </div>
  <button class="quick-toggle" type="button" data-quick-toggle aria-label="상담 및 예약 메뉴 열기" aria-expanded="false" aria-controls="quick-actions">
    <svg class="quick-eye" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path class="quick-eye-outline" d="M4 20S10 10 20 10s16 10 16 10-6 10-16 10S4 20 4 20Z" stroke="currentColor" stroke-width="2"/><g class="quick-eye-pupil"><circle cx="20" cy="20" r="6" fill="currentColor"/><circle cx="22" cy="18" r="2" fill="#3672c3"/></g></svg>
    <svg class="quick-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
  </button>
</aside>
